version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # react と react-dom は完全に同一バージョンである必要がある
      # (不一致だと react-dom が "Incompatible React versions" で throw する)。
      # 別 PR で片方だけ auto-merge されると main が壊れるため 1 PR にまとめる。
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # windows / webview2-com は wry (tauri-runtime-wry) が使う版と揃える必要がある。
      # 単独で 0.x のマイナー (= 破壊的変更) を上げると二重版になり型不整合でビルドが壊れるので、
      # パッチだけ自動で受け、マイナー以上は tauri の更新に合わせて手で上げる
      # (2026-10-04: tauri 2.12 / wry 0.57 に合わせて webview2-com 0.39 / windows 0.62 へ追従、#173)
      - dependency-name: "windows"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "webview2-com"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
